{% extends "layout4testing.html" %}
{% block title %}GIF Maker {{ version }} {% endblock %}
{% block body %}

<script>
  jQuery(function () {
    jQuery("#submit_button").click(function () {

      let t = jQuery("input[name=t]").val();
      let login = jQuery("input[name=login]").val();
      let password = jQuery("input[name=password]").val();
      let template = jQuery("select[name=template]").val();

      let d = {
        t: t,
        login: login,
        password: password,
        template: template,
        token: window.gifMakerAuthToken
      };

      console.log("Sending request");
      console.log(d);

      jQuery.ajax({
        url: '/g',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(d),
      })
        .done(function (data) {
          jQuery('#result_text').html('');
          jQuery('#result_image').attr('src', '');

          console.log("Receiving response");
          console.log(data);

          // print JSON response in any case
          jQuery('#result_text').html('<pre>' + JSON.stringify(data, null, 2) + '</pre>')

          if (!data.error) {
            jQuery('#result_image').attr('src', data.result);

            // use black color font for a normal response
            jQuery('#result_text').css('color', 'black');
          }
          else {
            // use red color font for an error response
            jQuery('#result_text').css('color', 'red');
          }
        });
    });
  });
</script>

<h2>Testing POST requests</h2>

<table>
  <tr>
    <td>
      Seed:
    </td>
    <td>
      <input type="text" name="t" value="">
    </td>
  </tr>

  <tr>
    <td>
      Login:
    </td>
    <td id="gif_maker_login">
    </td>
  </tr>

  <tr>
    <td>
      Password:
    </td>
    <td id="gif_maker_password">
    </td>
  </tr>

  <tr>
    <td>
      Template:
    </td>
    <td>
      <select name="template">
        <option value="1">F1(x,y)</option>
        <option value="2">F2(x,y)</option>
        <option value="3">F3(x,y)</option>
        <option value="4">F4(x,y)</option>
        <option value="5">F5(x,y)</option>
        <option value="100">LIFE Simple (Original)</option>
        <option value="200">LIFE My</option>
      </select>
    </td>
  </tr>

  <tr>
    <td>
      <input type="submit" id="submit_button" value="Generate">
    </td>
    <td>
    </td>
  </tr>
</table>

<h2>Result</h2>

<table>
  <tr>
    <td>
      Result Raw:
    </td>
    <td id="result_text">
    </td>
  </tr>
  <tr>
    <td>
      Result GIF:
    </td>
    <td>
      <img src="" id="result_image">
    </td>
  </tr>
</table>

{% endblock %}
